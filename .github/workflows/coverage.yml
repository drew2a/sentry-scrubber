name: Coverage

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  run_pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'

      - run: uv sync

      - name: Run Tests
        run: |
          uv run pytest \
            --cov \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Compare coverage (optional)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          uv run diff-cover coverage.xml \
            --compare-branch=origin/main \
            --json-report=diff_coverage.json \
            --fail-under=80

      - name: Annotate uncovered lines
        if: ${{ always() && github.event_name == 'pull_request' }}
        # The owner's own action, on its major tag on purpose: every release moves the tag,
        # so users get fixes without a commit here.
        uses: drew2a/annotate-coverage-action@v1 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          json_path: "diff_coverage.json"
