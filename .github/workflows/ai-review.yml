name: AI Review
on: [ pull_request ]
permissions:
  pull-requests: write
jobs:
  review:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The v2 tag is moved on purpose by every ai-review release, and the action is the
      # owner's own, so it stays on the tag instead of a commit hash.
      - uses: drew2a/ai-review@v2 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        env:
          # Free OpenRouter models come and go: set the LLM_MODEL repository variable to switch
          # without a commit. Pick a `:free` model that supports structured outputs.
          LLM_MODEL: ${{ vars.LLM_MODEL || 'openrouter/nvidia/nemotron-3.5-super-vl:free' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          debug: true
          add_review_resolution: false
          add_joke: true
          author_customization: |
            drew2a: "Write comments on behalf of The Oracle from The Matrix film. Use cryptic wisdom, speak about choices and paths, offer guidance in a philosophical manner, and occasionally reference concepts like destiny, the Matrix, and seeing beyond the code."
