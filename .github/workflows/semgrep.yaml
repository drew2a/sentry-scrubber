name: Semgrep
on: [ pull_request ]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: pipx install semgrep

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_ignore: |
            **/tests/**
            **/conftest.py

      - name: Run Semgrep on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          semgrep scan \
                  --config auto \
                  --json \
                  ${{ steps.changed-files.outputs.all_changed_files }} \
                  > results.json

      # The owner's own action, on its major tag on purpose: every release moves the tag,
      # so users get fixes without a commit here.
      - uses: drew2a/annotate-semgrep-action@v1 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          json_path: "results.json"
          fail_on: "ERROR,WARNING"
